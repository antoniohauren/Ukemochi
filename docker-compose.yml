name: ukemochi

# api builds the image; migrate, reverb and scheduler reuse it.
x-php: &php
  image: ukemochi-php
  pull_policy: never
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ./api:/var/www/api
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ukemochi
      POSTGRES_USER: ukemochi
      POSTGRES_PASSWORD: ukemochi
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ukemochi", "-d", "ukemochi"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot: the other PHP services start after migrations ran.
  migrate:
    <<: *php
    command: php artisan migrate --force
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *php
    build: docker/php
    pull_policy: missing

  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  scheduler:
    <<: *php
    command: php artisan schedule:work

  # Dev only: ng serve for waitress (:4200) and admin (:4201), proxied by web.
  frontend:
    image: node:24-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    working_dir: /work
    environment:
      HOME: /tmp
      NG_CLI_ANALYTICS: "false"
      npm_config_update_notifier: "false"
    volumes:
      - ./frontend:/work
    command: npm start
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Only public material and the server key; the CA private key stays on the host.
      - ./docker/certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./docker/certs/key.pem:/etc/nginx/certs/key.pem:ro
      - ./docker/certs/ca/rootCA.pem:/etc/nginx/certs/rootCA.pem:ro
    depends_on:
      - api
      - reverb
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
