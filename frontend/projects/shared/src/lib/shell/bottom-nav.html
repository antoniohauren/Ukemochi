<nav class="bar">
  @for (item of tabs(); track item.path) {
    <a class="tab" [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="indicator"
        ><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon></span
      >
      <span class="label">{{ item.label | t }}</span>
    </a>
  }
  @if (overflow().length > 0) {
    <button type="button" class="tab" [class.active]="overflowActive()" [matMenuTriggerFor]="more">
      <span class="indicator"><mat-icon aria-hidden="true">more_horiz</mat-icon></span>
      <span class="label">{{ 'nav.more' | t }}</span>
    </button>
    <mat-menu #more="matMenu">
      @for (item of overflow(); track item.path) {
        <a mat-menu-item [routerLink]="item.path">
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label | t }}</span>
        </a>
      }
    </mat-menu>
  }
</nav>
