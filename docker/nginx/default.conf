map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: hands out the local CA for phones, redirects everything else to HTTPS.
server {
    listen 80;

    location = /ca.crt {
        alias /etc/nginx/certs/rootCA.pem;
        default_type application/x-x509-ca-cert;
    }

    # Reflecting Host is accepted: nothing caches the redirect, and a client only redirects itself.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    client_max_body_size 20m;

    # Laravel front controller (php-fpm in the api container).
    location ~ ^/(api|sanctum|broadcasting|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        # Overwrite (not append) so clients cannot spoof their IP; Laravel trusts this via trustProxies.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # Reverb HTTP publish API stays internal (api talks to reverb:8080 directly).
    location ^~ /apps/ {
        return 404;
    }

    # Reverb websocket: /app/{key}.
    location ~ ^/app/[A-Za-z0-9_-]+$ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    # Angular dev servers (Vite only accepts known hosts, so present as localhost).
    location /admin/ {
        proxy_pass http://frontend:4201;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host localhost;
    }

    location / {
        proxy_pass http://frontend:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host localhost;
    }
}
